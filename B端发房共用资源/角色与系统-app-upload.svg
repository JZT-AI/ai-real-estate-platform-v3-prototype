<svg xmlns="http://www.w3.org/2000/svg" style="font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif" width="1720" height="1054" viewBox="0 0 1720 1054"><defs><marker id="arrow-app-upload" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#75869c" /></marker></defs><rect width="100%" height="100%" fill="#fff" /><text x="26" y="33" font-size="24" font-weight="650" fill="#17263b">APP独立上传｜角色与系统泳道</text><text x="26" y="65" font-size="14" fill="#69788a">悬浮上传或无结果引导，均为独立上传；右上进入上传任务。统一成功与房源卡片；新的主动上传成功推进排序；处理中沿原任务继续。</text><rect x="20" y="106" width="1680" height="142" fill="#ffffff" stroke="#dce3ed" /><rect x="20" y="106" width="190" height="142" fill="#eef2f7" stroke="#dce3ed" /><text x="38" y="166" font-size="16" font-weight="650" fill="#24364c">西安安家顾问</text><text x="38" y="191" font-size="12" font-weight="400" fill="#68778c">角色 · 已入驻平台</text><rect x="20" y="248" width="1680" height="142" fill="#f8fafc" stroke="#dce3ed" /><rect x="20" y="248" width="190" height="142" fill="#eef2f7" stroke="#dce3ed" /><text x="38" y="308" font-size="16" font-weight="650" fill="#24364c">有客APP（客户端）</text><text x="38" y="333" font-size="12" font-weight="400" fill="#68778c">系统 · 房源管理 / 上传任务</text><rect x="20" y="390" width="1680" height="142" fill="#ffffff" stroke="#dce3ed" /><rect x="20" y="390" width="190" height="142" fill="#eef2f7" stroke="#dce3ed" /><text x="38" y="450" font-size="16" font-weight="650" fill="#24364c">有客APP（后台）</text><text x="38" y="475" font-size="12" font-weight="400" fill="#68778c">系统归属 · 受理、串行、本人列表</text><rect x="20" y="532" width="1680" height="142" fill="#f8fafc" stroke="#dce3ed" /><rect x="20" y="532" width="190" height="142" fill="#eef2f7" stroke="#dce3ed" /><text x="38" y="592" font-size="16" font-weight="650" fill="#24364c">AI房地产数据平台</text><text x="38" y="617" font-size="12" font-weight="400" fill="#68778c">系统 · 采集、生产、湖仓消费</text><rect x="20" y="674" width="1680" height="142" fill="#ffffff" stroke="#dce3ed" /><rect x="20" y="674" width="190" height="142" fill="#eef2f7" stroke="#dce3ed" /><text x="38" y="734" font-size="16" font-weight="650" fill="#24364c">平台运营</text><text x="38" y="759" font-size="12" font-weight="400" fill="#68778c">角色 · 数据平台后台</text><rect x="20" y="816" width="1680" height="142" fill="#f8fafc" stroke="#dce3ed" /><rect x="20" y="816" width="190" height="142" fill="#eef2f7" stroke="#dce3ed" /><text x="38" y="876" font-size="16" font-weight="650" fill="#24364c">微信（外部应用）</text><text x="38" y="901" font-size="12" font-weight="400" fill="#68778c">系统 · 指定企微好友资料页</text><polyline points="405,187 416,187 416,329 427,329" fill="none" stroke="#75869c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-app-upload)" /><polyline points="607,329 618,329 618,471 629,471" fill="none" stroke="#75869c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-app-upload)" /><polyline points="809,471 820,471 820,613 831,613" fill="none" stroke="#75869c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-app-upload)" /><polyline points="1011,613 1022,613 1022,613 1033,613" fill="none" stroke="#75869c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-app-upload)" /><polyline points="1213,613 1224,613 1224,471 1235,471" fill="none" stroke="#75869c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-app-upload)" /><polyline points="1415,471 1426,471 1426,329 1437,329" fill="none" stroke="#75869c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-app-upload)" /><polyline points="1527,290 1527,226" fill="none" stroke="#75869c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-app-upload)" /><polyline points="809,471 820,471 820,755 831,755" fill="none" stroke="#75869c" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#arrow-app-upload)" /><rect x="793" y="532" width="54" height="20" rx="4" fill="#fff" /><text x="820" y="546" text-anchor="middle" font-size="11" fill="#5b6b80">记录过程</text><polyline points="1325,510 1325,716" fill="none" stroke="#75869c" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#arrow-app-upload)" /><rect x="1298" y="603" width="54" height="20" rx="4" fill="#fff" /><text x="1325" y="617" text-anchor="middle" font-size="11" fill="#5b6b80">后台查询</text><polyline points="1415,471 1421,471 1421,897 1415,897" fill="none" stroke="#75869c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-app-upload)" /><rect x="1399.5" y="674" width="43" height="20" rx="4" fill="#fff" /><text x="1421" y="688" text-anchor="middle" font-size="11" fill="#5b6b80">未完成</text><rect x="225" y="148" width="180" height="78" rx="10" fill="#eef4ff" stroke="#a8bde8" /><text x="315" y="171" text-anchor="middle" font-size="13.5" fill="#24364c">悬浮上传／无结果引导</text><text x="315" y="191" text-anchor="middle" font-size="13.5" fill="#24364c">粘贴一条或多条链接</text><text x="315" y="211" text-anchor="middle" font-size="13.5" fill="#24364c">上传不自动发客户</text><rect x="427" y="290" width="180" height="78" rx="10" fill="#fff" stroke="#b7c4d5" /><text x="517" y="313" text-anchor="middle" font-size="13.5" fill="#24364c">按统一规则校验输入</text><text x="517" y="333" text-anchor="middle" font-size="13.5" fill="#24364c">提交原文＋本人B端账号</text><text x="517" y="353" text-anchor="middle" font-size="13.5" fill="#24364c">查看原上传任务</text><rect x="629" y="432" width="180" height="78" rx="10" fill="#fff" stroke="#b7c4d5" /><text x="719" y="455" text-anchor="middle" font-size="13.5" fill="#24364c">校验目标账号传房资格</text><text x="719" y="475" text-anchor="middle" font-size="13.5" fill="#24364c">按套协调上传处理</text><text x="719" y="495" text-anchor="middle" font-size="13.5" fill="#24364c">维护本人房源列表</text><rect x="831" y="574" width="180" height="78" rx="10" fill="#fff" stroke="#b7c4d5" /><text x="921" y="597" text-anchor="middle" font-size="13.5" fill="#24364c">统一解析、去重并统计</text><text x="921" y="617" text-anchor="middle" font-size="13.5" fill="#24364c">检查来源数据时效</text><text x="921" y="637" text-anchor="middle" font-size="13.5" fill="#24364c">按需复用或更新同一房源</text><rect x="1033" y="574" width="180" height="78" rx="10" fill="#fff" stroke="#b7c4d5" /><text x="1123" y="597" text-anchor="middle" font-size="13.5" fill="#24364c">入库即生成业务房源</text><text x="1123" y="617" text-anchor="middle" font-size="13.5" fill="#24364c">湖仓有数据，下游可消费</text><text x="1123" y="637" text-anchor="middle" font-size="13.5" fill="#24364c">小区治理独立，不阻塞上传</text><rect x="1235" y="432" width="180" height="78" rx="10" fill="#fff" stroke="#b7c4d5" /><text x="1325" y="455" text-anchor="middle" font-size="13.5" fill="#24364c">写入经纪人房源关系</text><text x="1325" y="475" text-anchor="middle" font-size="13.5" fill="#24364c">保留首次关联时间</text><text x="1325" y="495" text-anchor="middle" font-size="13.5" fill="#24364c">成功更新最近上传排序</text><rect x="1437" y="290" width="180" height="78" rx="10" fill="#fff" stroke="#b7c4d5" /><text x="1527" y="313" text-anchor="middle" font-size="13.5" fill="#24364c">上传任务：列表→详情</text><text x="1527" y="333" text-anchor="middle" font-size="13.5" fill="#24364c">统一上传成功及房源卡片</text><text x="1527" y="353" text-anchor="middle" font-size="13.5" fill="#24364c">上传结束进入系统通知</text><rect x="1437" y="148" width="180" height="78" rx="10" fill="#eef4ff" stroke="#a8bde8" /><text x="1527" y="171" text-anchor="middle" font-size="13.5" fill="#24364c">卡片⋯更新、删除</text><text x="1527" y="191" text-anchor="middle" font-size="13.5" fill="#24364c">左滑更新、删除</text><text x="1527" y="211" text-anchor="middle" font-size="13.5" fill="#24364c">按最近成功上传排序</text><rect x="831" y="716" width="180" height="78" rx="10" fill="#f0f7f5" stroke="#a6c7bb" /><text x="921" y="739" text-anchor="middle" font-size="13.5" fill="#24364c">数据接入→房源上传记录</text><text x="921" y="759" text-anchor="middle" font-size="13.5" fill="#24364c">原始消息及各套结果</text><text x="921" y="779" text-anchor="middle" font-size="13.5" fill="#24364c">具体失败原因</text><rect x="1235" y="716" width="180" height="78" rx="10" fill="#f0f7f5" stroke="#a6c7bb" /><text x="1325" y="739" text-anchor="middle" font-size="13.5" fill="#24364c">业务对象→房源</text><text x="1325" y="759" text-anchor="middle" font-size="13.5" fill="#24364c">查看经纪人关联关系</text><text x="1325" y="779" text-anchor="middle" font-size="13.5" fill="#24364c">沿权威关系只读查询</text><rect x="1235" y="858" width="180" height="78" rx="10" fill="#fff4e9" stroke="#e2b587" /><text x="1325" y="881" text-anchor="middle" font-size="13.5" fill="#24364c">上传失败点击咨询客服</text><text x="1325" y="901" text-anchor="middle" font-size="13.5" fill="#24364c">打开指定企微好友资料页</text><text x="1325" y="921" text-anchor="middle" font-size="13.5" fill="#24364c">由经纪人点击发消息</text><text x="26" y="1010" font-size="12" fill="#8a96a7">规则由数据平台维护，入口按同一规则判断；套数由数据平台解析确定；各端使用对应展示原因。</text></svg>