<svg style="font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif" xmlns="http://www.w3.org/2000/svg" width="1720" height="1054" viewBox="0 0 1720 1054"><defs><marker id="arrow-wecom" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#75869c"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="26" y="33" font-size="24" font-weight="650" fill="#17263b">企微上传｜客服视角、准入与完成回执</text><text x="26" y="65" font-size="14" fill="#69788a">经纪人正常与企微客服聊天；客服平台只显示纯文本回执。受理与完成回复均为普通客服文本，本期不加系统消息标注。</text><rect x="20" y="106" width="1680" height="142" fill="#ffffff" stroke="#dce3ed"/><rect x="20" y="106" width="190" height="142" fill="#eef2f7" stroke="#dce3ed"/><text x="38" y="166" font-size="16" font-weight="650" fill="#24364c">经纪人</text><text x="38" y="191" font-size="12" font-weight="400" fill="#68778c">角色 · 企微来消息</text><rect x="20" y="248" width="1680" height="142" fill="#f8fafc" stroke="#dce3ed"/><rect x="20" y="248" width="190" height="142" fill="#eef2f7" stroke="#dce3ed"/><text x="38" y="308" font-size="16" font-weight="650" fill="#24364c">客服 / 私域运营平台</text><text x="38" y="333" font-size="12" font-weight="400" fill="#68778c">角色＋系统 · 正常客服会话</text><rect x="20" y="390" width="1680" height="142" fill="#ffffff" stroke="#dce3ed"/><rect x="20" y="390" width="190" height="142" fill="#eef2f7" stroke="#dce3ed"/><text x="38" y="450" font-size="16" font-weight="650" fill="#24364c">有客APP（后台）</text><text x="38" y="475" font-size="12" font-weight="400" fill="#68778c">系统归属 · 受理、身份与本人列表</text><rect x="20" y="532" width="1680" height="142" fill="#f8fafc" stroke="#dce3ed"/><rect x="20" y="532" width="190" height="142" fill="#eef2f7" stroke="#dce3ed"/><text x="38" y="592" font-size="16" font-weight="650" fill="#24364c">AI房地产数据平台</text><text x="38" y="617" font-size="12" font-weight="400" fill="#68778c">系统自动 · 公共房源生产</text><rect x="20" y="674" width="1680" height="142" fill="#ffffff" stroke="#dce3ed"/><rect x="20" y="674" width="190" height="142" fill="#eef2f7" stroke="#dce3ed"/><text x="38" y="734" font-size="16" font-weight="650" fill="#24364c">有客APP</text><text x="38" y="759" font-size="12" font-weight="400" fill="#68778c">系统 · 当前经纪人的我的房源</text><rect x="20" y="816" width="1680" height="142" fill="#f8fafc" stroke="#dce3ed"/><rect x="20" y="816" width="190" height="142" fill="#eef2f7" stroke="#dce3ed"/><text x="38" y="876" font-size="16" font-weight="650" fill="#24364c">客服 / 城市运营</text><text x="38" y="901" font-size="12" font-weight="400" fill="#68778c">角色 · 核对异常，无配置入口</text><polyline points="405,187 416,187 416,329 427,329" fill="none" stroke="#75869c" stroke-width="1.6" stroke-linejoin="round"  marker-end="url(#arrow-wecom)"/><polyline points="517,368 517,432" fill="none" stroke="#75869c" stroke-width="1.6" stroke-linejoin="round"  marker-end="url(#arrow-wecom)"/><polyline points="607,471 618,471 618,329 629,329" fill="none" stroke="#75869c" stroke-width="1.6" stroke-linejoin="round"  marker-end="url(#arrow-wecom)"/><rect x="602" y="390" width="32" height="20" rx="4" fill="#fff"/><text x="618" y="404" text-anchor="middle" font-size="11" fill="#5b6b80">通过</text><polyline points="607,471 618,471 618,471 629,471" fill="none" stroke="#75869c" stroke-width="1.6" stroke-linejoin="round"  marker-end="url(#arrow-wecom)"/><polyline points="607,471 618,471 618,260 1123,260 1123,290" fill="none" stroke="#75869c" stroke-width="1.6" stroke-linejoin="round"  marker-end="url(#arrow-wecom)"/><rect x="827" y="250" width="87" height="20" rx="4" fill="#fff"/><text x="870.5" y="264" text-anchor="middle" font-size="11" fill="#5b6b80">未通过，未受理</text><polyline points="809,471 820,471 820,613 831,613" fill="none" stroke="#75869c" stroke-width="1.6" stroke-linejoin="round"  marker-end="url(#arrow-wecom)"/><polyline points="1011,613 1022,613 1022,471 1033,471" fill="none" stroke="#75869c" stroke-width="1.6" stroke-linejoin="round"  marker-end="url(#arrow-wecom)"/><polyline points="1213,471 1224,471 1224,471 1235,471" fill="none" stroke="#75869c" stroke-width="1.6" stroke-linejoin="round"  marker-end="url(#arrow-wecom)"/><polyline points="1415,471 1426,471 1426,329 1437,329" fill="none" stroke="#75869c" stroke-width="1.6" stroke-linejoin="round"  marker-end="url(#arrow-wecom)"/><rect x="1399" y="390" width="54" height="20" rx="4" fill="#fff"/><text x="1426" y="404" text-anchor="middle" font-size="11" fill="#5b6b80">上传成功</text><polyline points="1527,290 1527,226" fill="none" stroke="#75869c" stroke-width="1.6" stroke-linejoin="round"  marker-end="url(#arrow-wecom)"/><polyline points="1617,187 1625,187 1625,755 1617,755" fill="none" stroke="#75869c" stroke-width="1.6" stroke-linejoin="round"  marker-end="url(#arrow-wecom)"/><rect x="1570.5" y="461" width="109" height="20" rx="4" fill="#fff"/><text x="1625" y="475" text-anchor="middle" font-size="11" fill="#5b6b80">收到成功回执后查看</text><polyline points="1123,510 1123,858" fill="none" stroke="#75869c" stroke-width="1.6" stroke-linejoin="round"  marker-end="url(#arrow-wecom)"/><rect x="1096" y="674" width="54" height="20" rx="4" fill="#fff"/><text x="1123" y="688" text-anchor="middle" font-size="11" fill="#5b6b80">身份不明</text><polyline points="1235,471 1224,471 1224,897 1213,897" fill="none" stroke="#75869c" stroke-width="1.6" stroke-linejoin="round"  marker-end="url(#arrow-wecom)"/><rect x="1197" y="674" width="54" height="20" rx="4" fill="#fff"/><text x="1224" y="688" text-anchor="middle" font-size="11" fill="#5b6b80">关联失败</text><polyline points="1213,897 1221,897 1221,329 1213,329" fill="none" stroke="#75869c" stroke-width="1.6" stroke-linejoin="round"  marker-end="url(#arrow-wecom)"/><rect x="1166.5" y="603" width="109" height="20" rx="4" fill="#fff"/><text x="1221" y="617" text-anchor="middle" font-size="11" fill="#5b6b80">说明实际未完成阶段</text><rect x="225" y="148" width="180" height="78" rx="10" fill="#eef4ff" stroke="#a8bde8"/><text x="315" y="171" text-anchor="middle" font-size="13.5" fill="#24364c">正常聊天发送房源链接</text><text x="315" y="191" text-anchor="middle" font-size="13.5" fill="#24364c">一条可含多套</text><text x="315" y="211" text-anchor="middle" font-size="13.5" fill="#24364c">无需固定口令</text><rect x="427" y="290" width="180" height="78" rx="10" fill="#fff" stroke="#b7c4d5"/><text x="517" y="313" text-anchor="middle" font-size="13.5" fill="#24364c">接口指定的西安城市客服</text><text x="517" y="333" text-anchor="middle" font-size="13.5" fill="#24364c">收到经纪人消息</text><text x="517" y="353" text-anchor="middle" font-size="13.5" fill="#24364c">提取房源候选链接</text><rect x="629" y="290" width="180" height="78" rx="10" fill="#fff" stroke="#b7c4d5"/><text x="719" y="313" text-anchor="middle" font-size="13.5" fill="#24364c">文本：已收到传房请求</text><text x="719" y="333" text-anchor="middle" font-size="13.5" fill="#24364c">处理完成后告知</text><text x="719" y="353" text-anchor="middle" font-size="13.5" fill="#24364c">普通文本，无额外标记</text><rect x="427" y="432" width="180" height="78" rx="10" fill="#fff" stroke="#b7c4d5"/><text x="517" y="455" text-anchor="middle" font-size="13.5" fill="#24364c">西安 · 已入驻安家顾问</text><text x="517" y="475" text-anchor="middle" font-size="13.5" fill="#24364c">接口指定的西安城市客服</text><text x="517" y="495" text-anchor="middle" font-size="13.5" fill="#24364c">先校验准入，再受理</text><rect x="629" y="432" width="180" height="78" rx="10" fill="#fff" stroke="#b7c4d5"/><text x="719" y="455" text-anchor="middle" font-size="13.5" fill="#24364c">按统一识别键校验去重</text><text x="719" y="475" text-anchor="middle" font-size="13.5" fill="#24364c">复用待处理 / 已有房源</text><text x="719" y="495" text-anchor="middle" font-size="13.5" fill="#24364c">按套串行处理</text><rect x="831" y="574" width="180" height="78" rx="10" fill="#fff" stroke="#b7c4d5"/><text x="921" y="597" text-anchor="middle" font-size="13.5" fill="#24364c">按需采集，入库即启动处理</text><text x="921" y="617" text-anchor="middle" font-size="13.5" fill="#24364c">业务房源＋两级小区关系</text><text x="921" y="637" text-anchor="middle" font-size="13.5" fill="#24364c">同小区识别，关系就绪可用</text><rect x="1033" y="432" width="180" height="78" rx="10" fill="#fff" stroke="#b7c4d5"/><text x="1123" y="465" text-anchor="middle" font-size="13.5" fill="#24364c">复核同一经纪人与权限</text><text x="1123" y="485" text-anchor="middle" font-size="13.5" fill="#24364c">沿用已确认的入驻身份</text><rect x="1235" y="432" width="180" height="78" rx="10" fill="#fff" stroke="#b7c4d5"/><text x="1325" y="455" text-anchor="middle" font-size="13.5" fill="#24364c">确保本人房源关系有效</text><text x="1325" y="475" text-anchor="middle" font-size="13.5" fill="#24364c">保留首次关联，更新上传排序</text><text x="1325" y="495" text-anchor="middle" font-size="13.5" fill="#24364c">统一通知上传成功</text><rect x="1437" y="290" width="180" height="78" rx="10" fill="#fff" stroke="#b7c4d5"/><text x="1527" y="313" text-anchor="middle" font-size="13.5" fill="#24364c">文本：处理完成及明细</text><text x="1527" y="333" text-anchor="middle" font-size="13.5" fill="#24364c">提示有客APP“我的房源”</text><text x="1527" y="353" text-anchor="middle" font-size="13.5" fill="#24364c">普通文本，无额外标记</text><rect x="1437" y="148" width="180" height="78" rx="10" fill="#eef4ff" stroke="#a8bde8"/><text x="1527" y="181" text-anchor="middle" font-size="13.5" fill="#24364c">收到上传成功文本</text><text x="1527" y="201" text-anchor="middle" font-size="13.5" fill="#24364c">前往APP“我的房源”</text><rect x="1437" y="716" width="180" height="78" rx="10" fill="#fff" stroke="#b7c4d5"/><text x="1527" y="739" text-anchor="middle" font-size="13.5" fill="#24364c">房源管理→我的房源</text><text x="1527" y="759" text-anchor="middle" font-size="13.5" fill="#24364c">上传任务查看结果</text><text x="1527" y="779" text-anchor="middle" font-size="13.5" fill="#24364c">均按当前本人身份</text><rect x="1033" y="858" width="180" height="78" rx="10" fill="#fff4e9" stroke="#e2b587"/><text x="1123" y="881" text-anchor="middle" font-size="13.5" fill="#24364c">身份不明 / 关联失败</text><text x="1123" y="901" text-anchor="middle" font-size="13.5" fill="#24364c">保留已收录的房源</text><text x="1123" y="921" text-anchor="middle" font-size="13.5" fill="#24364c">沿原记录核对或恢复</text><rect x="1033" y="290" width="180" height="78" rx="10" fill="#fff" stroke="#b7c4d5"/><text x="1123" y="313" text-anchor="middle" font-size="13.5" fill="#24364c">文本说明未受理/未完成原因</text><text x="1123" y="333" text-anchor="middle" font-size="13.5" fill="#24364c">不报上传成功</text><text x="1123" y="353" text-anchor="middle" font-size="13.5" fill="#24364c">不提示房源已加入本人</text><text x="26" y="1010" font-size="12" fill="#8a96a7">说明：受理与经纪人房源列表归有客APP后台；企微客服由接口配置，无后台配置页。失败后继续下一套仍待确认。</text></svg>