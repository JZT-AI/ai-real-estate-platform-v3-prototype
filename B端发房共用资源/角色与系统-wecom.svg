ne" stroke="#7b8b9d" stroke-width="2" marker-end="url(#arrow)" /><text x="1462.5" y="668.25" text-anchor="middle" font-size="12" fill="#718096" font-family="PingFang SC, sans-serif"><tspan x="1462.5" dy="0">最终上传记录</tspan></text><polyline points="1502.5,305 1502.5,200" fill="none" stroke="#7b8b9d" stroke-width="2" marker-end="url(#arrow)" /><text x="1502.5" y="243.5" text-anchor="middle" font-size="12" fill="#718096" font-family="PingFang SC, sans-serif"><tspan x="1502.5" dy="0">回复原会话</tspan></text><text x="885" y="812" text-anchor="middle" font-size="17" fill="#26354b" font-family="PingFang SC, sans-serif"><tspan x="885" dy="0">规则由数据平台维护，入口按同一规则判断；套数由数据平台解析确定；各端使用对应展示原因。</tspan></text></svg>