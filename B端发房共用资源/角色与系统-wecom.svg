<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="850" viewBox="0 0 1800 850"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#7b8b9d" /></marker></defs><rect width="1800" height="850" fill="white" /><text x="24" y="40" font-size="25" font-family="PingFang SC, sans-serif" fill="#26354b">企微上传｜角色与系统</text><rect x="20" y="100" width="1740" height="150" fill="#fff" stroke="#dfe5ed" /><rect x="20" y="100" width="195" height="150" fill="#f0f3f8" /><text x="118" y="172" text-anchor="middle" font-size="14" fill="#26354b" font-family="PingFang SC, sans-serif"><tspan x="118" dy="0">安家顾问（角色）</tspan></text><rect x="20" y="270" width="1740" height="150" fill="#fafbfc" stroke="#dfe5ed" /><rect x="20" y="270" width="195" height="150" fill="#f0f3f8" /><text x="118" y="342" text-anchor="middle" font-size="14" fill="#26354b" font-family="PingFang SC, sans-serif"><tspan x="118" dy="0">私域平台/企微客服（系统）</tspan></text><rect x="20" y="440" width="1740" height="150" fill="#fff" stroke="#dfe5ed" /><rect x="20" y="440" width="195" height="150" fill="#f0f3f8" /><text x="118" y="512" text-anchor="middle" font-size="14" fill="#26354b" font-family="PingFang SC, sans-serif"><tspan x="118" dy="0">有客APP后台（系统）</tspan></text><rect x="20" y="610" width="1740" height="150" fill="#fafbfc" stroke="#dfe5ed" /><rect x="20" y="610" width="195" height="150" fill="#f0f3f8" /><text x="118" y="682" text-anchor="middle" font-size="14" fill="#26354b" font-family="PingFang SC, sans-serif"><tspan x="118" dy="0">AI房地产数据平台（系统）</tspan></text><rect x="240" y="135" width="245" height="65" rx="10" fill="#eef4fd" stroke="#9eb6d6" /><text x="362.5" y="174" text-anchor="middle" font-size="16" fill="#26354b" font-family="PingFang SC, sans-serif"><tspan x="362.5" dy="0">发送含房源链接的原消息</tspan></text><rect x="1380" y="135" width="245" height="65" rx="10" fill="#eef4fd" stroke="#9eb6d6" /><text x="1502.5" y="174" text-anchor="middle" font-size="16" fill=