ect x="1437" y="290" width="180" height="78" rx="10" fill="#fff" stroke="#b7c4d5" /><text x="1527" y="313" text-anchor="middle" font-size="13.5" fill="#24364c">会话悬浮上传提示</text><text x="1527" y="333" text-anchor="middle" font-size="13.5" fill="#24364c">点击原上传任务详情</text><text x="1527" y="353" text-anchor="middle" font-size="13.5" fill="#24364c">完成后查看APP系统通知</text><rect x="1437" y="148" width="180" height="78" rx="10" fill="#eef4ff" stroke="#a8bde8" /><text x="1527" y="171" text-anchor="middle" font-size="13.5" fill="#24364c">经纪人头像＋房源卡片</text><text x="1527" y="191" text-anchor="middle" font-size="13.5" fill="#24364c">与原来发房消息相同</text><text x="1527" y="211" text-anchor="middle" font-size="13.5" fill="#24364c">可继续发送新消息</text><rect x="427" y="716" width="180" height="78" rx="10" fill="#fff" stroke="#b7c4d5" /><text x="517" y="749" text-anchor="middle" font-size="13.5" fill="#24364c">未命中房源链接</text><text x="517" y="769" text-anchor="middle" font-size="13.5" fill="#24364c">沿原普通消息流程发送</text><rect x="629" y="858" width="180" height="78" rx="10" fill="#eef4ff" stroke="#a8bde8" /><text x="719" y="901" text-anchor="middle" font-size="13.5" fill="#24364c">收到普通聊天内容</text><rect x="1033" y="1000" width="180" height="78" rx="10" fill="#fff4e9" stroke="#e2b587" /><text x="1123" y="1023" text-anchor="middle" font-size="13.5" fill="#24364c">失败项可点击咨询客服</text><text x="1123" y="1043" text-anchor="middle" font-size="13.5" fill="#24364c">微信打开指定企微好友</text><text x="1123" y="1063" text-anchor="middle" font-size="13.5" fill="#24364c">已送达房源不重发</text><text x="26" y="1152" font-size="12" fill="#8a96a7">说明：受理与经纪人房源列表归有客APP后台；企微客服由接口配置，无后台配置页。失败后继续下一套仍待确认。</text><polyline points="517,226 517,237 824,237 824,471 831,471" fill="none" stroke="#75869c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-app-chat)" /><polyline points="1011,471 1025,471 1025,700 1325,700 1325,716" fill="none" stroke="#75869c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-app-chat)" /><rect x="