<svg xmlns="http://www.w3.org/2000/svg" style="font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif" width="1720" height="1196" viewBox="0 0 1720 1196"><defs><marker id="arrow-app-chat" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#75869c" /></marker></defs><rect width="100%" height="100%" fill="#fff" /><text x="26" y="33" font-size="24" font-weight="650" fill="#17263b">APP客户会话｜角色与系统泳道</text><text x="26" y="65" font-size="14" fill="#69788a">链接上传先识别并处理；库内选房直接发送原房源卡片，不采集、不补关联、不建上传任务。纯文字沿原聊天发送。</text><rect x="20" y="106" width="1680" height="142" fill="#ffffff" stroke="#dce3ed" /><rect x="20" y="106" width="190" height="142" fill="#eef2f7" stroke="#dce3ed" /><text x="38" y="166" font-size="16" font-weight="650" fill="#24364c">经纪人</text><text x="38" y="191" font-size="12" font-weight="400" fill="#68778c">角色 · 有客APP发送方</text><rect x="20" y="248" width="1680" height="142" fill="#f8fafc" stroke="#dce3ed" /><rect x="20" y="248" width="190" height="142" fill="#eef2f7" stroke="#dce3ed" /><text x="38" y="308" font-size="16" font-weight="650" fill="#24364c">有客APP（客户端）</text><text x="38" y="333" font-size="12" font-weight="400" fill="#68778c">系统 · 原客户会话</text><rect x="20" y="390" width="1680" height="142" fill="#ffffff" stroke="#dce3ed" /><rect x="20" y="390" width="190" height="142" fill="#eef2f7" stroke="#dce3ed" /><text x="38" y="450" font-size="16" font-weight="650" fill="#24364c">有客APP（后台）</text><text x="38" y="475" font-size="12" font-weight="400" fill="#68778c">系统归属 · 原目标与逐套处理</text><rect x="20" y="532" width="1680" height="142" fill="#f8fafc" stroke="#dce3ed" /><rect x="20" y="532" width="190" height="142" fill="#eef2f7" stroke="#dce3ed" /><text x="38" y="592" font-size="16" font-weight="650" fill="#24364c">AI房地产数据平台</text><text x="38" y="617" font-size="12" font-weight="400" fill="#68778c">系统自动 · 复用 / 采集 / 消费</text><rect x="20" y="674" width="1680" height="142" fill="#ffffff" stroke="#dce3ed" /><rect x="20" y="674" width="190" height="142" fill="#eef2f7" stroke="#dce3ed" /><text x="38" y="734" font-size="16" font-weight="650" fill="#24364c">有客APP（消息能力）</text><text x="38" y="759" font-size="12" font-weight="400" fill="#68778c">系统归属 · 实际投递结果</text><rect x="20" y="816" width="1680" height="142" fill="#f8fafc" stroke="#dce3ed" /><rect x="20" y="816" width="190" height="142" fill="#eef2f7" stroke="#dce3ed" /><text x="38" y="876" font-size="16" font-weight="650" fill="#24364c">C端用户</text><text x="38" y="901" font-size="12" font-weight="400" fill="#68778c">角色 · 原接收会话 / 小程序</text><rect x="20" y="958" width="1680" height="142" fill="#ffffff" stroke="#dce3ed" /><rect x="20" y="958" width="190" height="142" fill="#eef2f7" stroke="#dce3ed" /><text x="38" y="1018" font-size="16" font-weight="650" fill="#24364c">经纪人异常反馈</text><text x="38" y="1043" font-size="12" font-weight="400" fill="#68778c">角色 · APP原记录</text><polyline points="405,187 416,187 416,329 427,329" fill="none" stroke="#75869c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-app-chat)" /><polyline points="607,329 618,329 618,471 629,471" fill="none" stroke="#75869c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-app-chat)" /><rect x="602" y="390" width="32" height="20" rx="4" fill="#fff" /><text x="618" y="404" text-anchor="middle" font-size="11" fill="#5b6b80">命中</text><polyline points="809,471 820,471 820,613 831,613" fill="none" stroke="#75869c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-app-chat)" /><polyline points="1011,613 1022,613 1022,471 1033,471" fill="none" stroke="#75869c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-app-chat)" /><polyline points="1213,471 1224,471 1224,755 1235,755" fill="none" stroke="#75869c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arrow-app-chat)" /><polyline points="1415,755 1426,755 1426,897 1437,897" fill="none" stroke="#75869c" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ar